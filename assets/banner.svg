<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 48px; font-weight: bold; fill: url(#textGrad); }
      .subtitle { font-family: system-ui, sans-serif; font-size: 24px; fill: #94a3b8; }
      .pulse { animation: pulseAnim 3s infinite; }
      @keyframes pulseAnim {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </defs>
  <rect width="800" height="200" rx="20" fill="url(#bg)" />
  <circle cx="100" cy="100" r="50" fill="#38bdf8" opacity="0.2" class="pulse" transform-origin="100 100" />
  <circle cx="700" cy="100" r="70" fill="#818cf8" opacity="0.2" class="pulse" transform-origin="700 100" style="animation-delay: 1.5s;" />
  <text x="400" y="100" text-anchor="middle" class="title">Awesome Crew Management</text>
  <text x="400" y="140" text-anchor="middle" class="subtitle">Aviation &amp; Maritime Optimization</text>
</svg>
